# Configuration for the Agent Tools MCP project-mcp server.
#
# Edit this file to point the server at a project and enable the command tools.
# It is read at startup, so changes take effect on the next run — no re-scaffold.

# Project root the server operates within (relative to this config file).
# Points at the agent-tools monorepo itself — this instance lives inside it, at
# mcps/agent-tools-mcp/, so "../.." is the repo root.
root = "../.."

[commands]
# Each entry is an argv array (NOT a shell string). Empty/absent = tool disabled.
# Only these exact argv are ever executed — there is no arbitrary-exec tool.
#
# Intentionally left disabled: agent-tools is a polyglot monorepo with NO
# repo-wide test/lint/build (each unit carries its own `make test`/`make lint`).
# A single test/lint/build argv here would misrepresent the repo, so the command
# tools are off and this server exposes code search/read, docs, and read-only git.
# To exercise a specific unit, run its own `make` targets from that unit's dir.
# test  = [...]
# lint  = [...]
# build = [...]

[docs]
# Files or directories (under root) exposed via the docs tools. Missing entries
# are skipped. The docs surface is the repo's front door (README.md) and rulebook
# (CLAUDE.md), plus the scaffolding guide (templates/README.md).
paths = ["README.md", "CLAUDE.md", "templates/README.md"]
