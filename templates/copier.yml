# Copier template for agent-tools units.
#
# One template, switched by `kind`. `_subdirectory` resolves to the chosen
# kind's folder, so only that project tree is rendered. See templates/README.md.
_min_copier_version: "9.0.0"
_subdirectory: "{{ kind }}"
_answers_file: ".copier-answers.yml"
_envops:
  trim_blocks: true
  lstrip_blocks: true

_message_after_copy: |
  {% if kind == 'claude-agent' %}
  Created claude-agent "{{ name }}" ({{ slug }}.md). Fill in the system-prompt body;
  it is then available as a subagent in .claude/agents/.
  {% elif kind == 'skill' %}
  Created skill "{{ name }}" (skills/{{ slug }}/SKILL.md). Fill in the body and
  tighten the `description` to triggering conditions only ("Use when…").
  {% else %}
  Created {{ kind }} unit "{{ name }}" ({{ slug }}).
  Next:
    cd {{ _copier_conf.dst_path }}
    make test
  {% endif %}

kind:
  type: str
  help: What kind of unit to scaffold?
  choices:
    - go-mcp
    - python-tool
    - project-mcp
    - claude-agent
    - skill

name:
  type: str
  help: 'Human-readable name, e.g. "Vector Store"'
  validator: "{% if not name.strip() %}name must not be empty{% endif %}"

description:
  type: str
  help: One-line description of the unit
  default: "A {{ kind }} unit."

author_name:
  type: str
  default: Grimm07

author_email:
  type: str
  default: trystan.tbm@gmail.com

# ---- project-mcp command allowlist (only asked for the project-mcp kind) ----
# Each answer is a TOML argv array written verbatim into project-mcp.toml's
# [commands] table (the server execs argv directly, never via a shell). An empty
# answer leaves that command tool disabled (commented out in the config).
test_command:
  type: str
  help: 'Test command as a TOML array, e.g. ["go","test","./..."] (empty to disable)'
  default: ""
  when: "{{ kind == 'project-mcp' }}"
  validator: >-
    {% if kind == 'project-mcp' and test_command and not (test_command.strip().startswith('[') and test_command.strip().endswith(']')) %}test_command must be a TOML array like ["go","test","./..."]{% endif %}

lint_command:
  type: str
  help: 'Lint command as a TOML array, e.g. ["golangci-lint","run"] (empty to disable)'
  default: ""
  when: "{{ kind == 'project-mcp' }}"
  validator: >-
    {% if kind == 'project-mcp' and lint_command and not (lint_command.strip().startswith('[') and lint_command.strip().endswith(']')) %}lint_command must be a TOML array like ["golangci-lint","run"]{% endif %}

build_command:
  type: str
  help: 'Build command as a TOML array, e.g. ["go","build","./..."] (empty to disable)'
  default: ""
  when: "{{ kind == 'project-mcp' }}"
  validator: >-
    {% if kind == 'project-mcp' and build_command and not (build_command.strip().startswith('[') and build_command.strip().endswith(']')) %}build_command must be a TOML array like ["go","build","./..."]{% endif %}

# ---- claude-agent fields (only asked for the claude-agent kind) ----
# Rendered into the subagent's YAML frontmatter at .claude/agents/<slug>.md.
agent_description:
  type: str
  help: "When should Claude delegate to this agent? (becomes the `description` it triggers on)"
  default: "{{ description }}"
  when: "{{ kind == 'claude-agent' }}"

agent_tools:
  type: str
  help: "Tools the agent may use, comma-separated (e.g. 'Read, Grep, Glob, Bash'); or 'inherit' for all"
  default: "Read, Grep, Glob, Bash"
  when: "{{ kind == 'claude-agent' }}"

agent_model:
  type: str
  help: "Model for this agent"
  default: inherit
  choices:
    - inherit
    - sonnet
    - opus
    - haiku
  when: "{{ kind == 'claude-agent' }}"

# ---- skill fields (only asked for the skill kind) ----
# Rendered into SKILL.md's YAML frontmatter at skills/<slug>/SKILL.md. The
# `description` is the ONLY thing Claude reads to decide whether to load the
# skill, so it must be triggering conditions ("Use when…"), not a workflow
# summary — see the comments in the scaffolded SKILL.md.
skill_description:
  type: str
  help: >-
    When should this skill trigger? Becomes the `description`. Start with "Use when…"
    and list concrete symptoms/contexts only — do NOT summarize the workflow.
  default: "Use when {{ description }}"
  when: "{{ kind == 'skill' }}"
  validator: >-
    {% if kind == 'skill' and not skill_description.strip() %}skill_description must not be empty{% endif %}

# ---- Derived identifiers (computed, never prompted: `when: false`) ----
# slug:      kebab-case, used for dirs, binary/script name, module/dist name.
# go_pkg:    a valid Go package identifier (letters/digits only).
# py_module: a valid Python module identifier (snake_case).
slug:
  type: str
  default: "{{ name | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

go_pkg:
  type: str
  default: "{{ slug | replace('-', '') }}"
  when: false

py_module:
  type: str
  default: "{{ slug | replace('-', '_') }}"
  when: false

# Post-generation setup. Gated behind `copier copy --trust`.
# (No `git init` on purpose: units stay part of the agent-tools monorepo.)
_tasks:
  - command: ["go", "mod", "tidy"]
    when: "{{ kind == 'go-mcp' }}"
  - command: ["go", "mod", "tidy"]
    when: "{{ kind == 'project-mcp' }}"
  - command: ["uv", "sync"]
    when: "{{ kind == 'python-tool' }}"
